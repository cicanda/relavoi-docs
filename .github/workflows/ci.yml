name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        # No continue-on-error anywhere in this file. Errors fail the build;
        # warnings are reported and do not. See eslint.config.mjs.
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: SDK install pages name the newest published tag
        # These pages told readers to install version 0.1.0 of three SDKs from
        # an organisation that is not ours. The organisation half cannot come
        # back quietly; the version half can, every time an SDK is released.
        # Reads public tag lists, needs no credential, skips rather than fails
        # when the runner cannot reach GitHub.
        run: npm run check:sdk-versions

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: build/
          retention-days: 7
